# config/sources.yaml
# 数据源集中配置。对应报告《全民反对，美国 AI 基建的"逆风"？》数据规划 v1 §1。
# level: A=骨架(政府/法定/监管) B=补充(方法论公开的商业研究) C=标注(私人追踪/单次调查，不单独成图)
# env_status: 记录本沙盒环境(2026-08-16测试)对该源的可达性，供后续在有网络权限的环境中复核。
#   - blocked_here: 出站代理策略拦截(curl/requests均403 policy denial)，需在无此限制的环境重跑fetch脚本
#   - registration_required: 需注册/登录才能拿历史各期
#   - paid: 需付费订阅
#   - manual_pdf: 无API，需下载PDF/XLS后手工/解析录入

electricity_and_rates:
  E1:
    name: "EIA API v2 electricity/retail-sales"
    level: A
    content: "分州分部门电价、售电量、客户数"
    frequency: monthly
    coverage: "2001-"
